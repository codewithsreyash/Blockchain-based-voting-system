<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d1f39">
  <title>Login | Decentralized Voting</title>
  <link rel="stylesheet" type="text/css" href="../css/login.css">
</head>

<body class="page-login">
  <header class="page-header">
    <h1>Decentralized Voting Using Ethereum Blockchain</h1>
    <p class="subtitle">Secure access for election administrators and voters</p>
  </header>

  <main class="container mt-5">
    <h2>Login</h2>
    <form id="loginForm">
      <div class="form-group">
        <label for="voter-id">Voter ID</label>
        <input type="text" class="form-control" id="voter-id" name="voter-id" placeholder="Voter ID" autocomplete="off" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" class="form-control" id="password" name="password" placeholder="Password" required>
      </div>
      <button type="submit" class="btn btn-primary">Login</button>
    </form>
  </main>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.0/umd/popper.min.js"></script>
  <script src="../js/login.js" type="module"></script>
</body>

</html>
